[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "automation-cli"
version = "0.1.0"
description = "CLI for selective releases of an Ansible/AAP automation monorepo."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Automation Team" }]
license = { text = "MIT" }
dependencies = [
    "typer>=0.9",
    "pydantic>=2",
    "pyyaml>=6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[project.scripts]
automation = "automation_cli.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
